name: Day 11 browser QA
on:
  push:
    paths:
      - '.github/workflows/day11-browser-qa.yml'
      - 'assets/photos/05-angela-smoker.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run actual responsive browser tests
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          python -m http.server 8799 --bind 127.0.0.1 >/tmp/day11-server.log 2>&1 &
          sleep 1
          mkdir -p /tmp/day11-qa
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          failed=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in [320,390,768,1440]:
                  page=browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1,reduced_motion='reduce')
                  try:
                      page.goto('http://127.0.0.1:8799/',wait_until='load',timeout=30000)
                      page.evaluate('''async () => {await Promise.all([...document.images].map(async img => {img.loading="eager"; try {await img.decode()} catch(e) {}}))}''')
                      page.wait_for_timeout(250)
                      checks=page.evaluate('''() => {
                        const h=document.querySelector('.hero h1').getBoundingClientRect();
                        const i=document.querySelector('.hero-image img').getBoundingClientRect();
                        return {title:document.title,
                          scrollWidth:document.documentElement.scrollWidth,
                          windowWidth:innerWidth,
                          horizontalOverflow:document.documentElement.scrollWidth-innerWidth,
                          headingRight:Math.round(h.right),headingLeft:Math.round(h.left),
                          heroImageHeight:Math.round(i.height),
                          brokenImages:[...document.images].filter(x=>!x.complete||!x.naturalWidth).map(x=>x.getAttribute('src')),
                          missingLocalLinks:[...document.querySelectorAll('a[href^="#"]')].filter(a=>!document.getElementById(a.getAttribute('href').slice(1))).map(a=>a.outerHTML.slice(0,100))}
                      }''')
                      if width<=768:
                          page.locator('.menu-toggle').click()
                          checks['mobileMenuOpens']=page.locator('.site-nav').evaluate('(el)=>el.classList.contains("open")')
                          page.locator('.site-nav a[href="#food"]').click()
                          checks['mobileMenuCloses']=page.locator('.menu-toggle').get_attribute('aria-expanded')=='false'
                      page.screenshot(path=f'/tmp/day11-qa/day11-{width}.png',full_page=True,timeout=30000)
                      print('QA',json.dumps({'width':width,**checks}),flush=True)
                      if checks['horizontalOverflow']>1 or checks['brokenImages'] or checks['missingLocalLinks'] or (width<=768 and not(checks['mobileMenuOpens'] and checks['mobileMenuCloses'])):failed.append(width)
                  except Exception as ex:
                      print('QA_ERROR',width,str(ex)[:300],flush=True)
                      failed.append(width)
                  finally: page.close()
              browser.close()
          if failed:raise SystemExit('Browser QA failed at widths '+str(failed))
          print('PASS: 320, 390, 768, 1440 px; images, links, menu, horizontal overflow, JavaScript',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day11-responsive-qa
          path: /tmp/day11-qa/
          if-no-files-found: ignore
