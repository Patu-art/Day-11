name: Optimize supplied Day 11 photography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    if: github.repository == 'Patu-art/Day-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert originals for fast responsive loading
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/photos')
          for name in ['01-sandwich','03-branded-smoker','04-brisket-slices','05-angela-smoker','07-meat-on-grill']:
              im=Image.open(root/(name+'.png')).convert('RGB')
              im.thumbnail((1500,1900),Image.Resampling.LANCZOS)
              im.save(root/(name+'.webp'),format='WEBP',quality=82,method=6)
          logo=Image.open(root/'06-official-logo.png').convert('RGB')
          logo=logo.crop((49,106,432,371))
          logo.thumbnail((640,420),Image.Resampling.LANCZOS)
          logo.save(root/'06-logo-cropped.webp',format='WEBP',quality=90,method=6)
          for path in sorted(root.glob('*.webp')):
              print(f'{path} {path.stat().st_size} bytes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized, web-ready real BBQ photography and cropped logo'
            git push
          fi
